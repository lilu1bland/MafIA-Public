<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MafIA</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<header>
  <b>MafIA</b>
  <span>
    <button id="btn-stats">Leaderboard</button>
    <span id="conn">connecting</span>
  </span>
</header>

<main>

  <section id="screen-home" class="screen active">
    <h1>MafIA</h1>
    <p>3 to 15 players. One extra seat per three humans is an AI. Talk, vote, survive.</p>
    <label for="name">Name</label>
    <input id="name" maxlength="20" placeholder="skibidi toilet" autocomplete="off" />
    <p><button id="btn-create">Create lobby</button></p>
    <p>
      <input id="code" maxlength="4" inputmode="numeric" placeholder="0000" autocomplete="off" />
      <button id="btn-join">Join</button>
    </p>
    <p id="home-error"></p>
  </section>

  <section id="screen-lobby" class="screen">
    <h1>Lobby <span id="lobby-code">----</span></h1>
    <p><span id="lobby-count"></span> &middot; <span id="lobby-model"></span></p>
    <ul id="lobby-players"></ul>
    <div id="host-controls" hidden>
      <label for="model-select">AI model</label>
      <select id="model-select"></select>
      <button id="btn-start">Start match</button>
    </div>
    <p id="lobby-hint"></p>
  </section>

  <section id="screen-game" class="screen">
    <div id="chat">
      <div id="phase-bar">
        <span id="phase-label"></span>
        <span id="phase-timer">--</span>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <button id="btn-gif">GIF</button>
        <input id="chat-input" maxlength="300" placeholder="Message" autocomplete="off" />
        <button id="btn-send">Send</button>
      </div>
      <p id="spectator-bar" hidden>You are dead. You can watch but not speak or vote.</p>
    </div>
    <aside>
      <h2 id="sidebar-title">Players</h2>
      <ul id="game-players"></ul>
      <div id="vote-panel" hidden>
        <h2>Vote</h2>
        <div id="vote-options"></div>
      </div>
      <p id="result-banner" hidden></p>
    </aside>
  </section>

</main>

<div id="gif-modal" class="modal" hidden>
  <div class="modal-body">
    <input id="gif-search" placeholder="Search GIFs" autocomplete="off" />
    <button id="gif-close">Close</button>
    <div id="gif-results"></div>
    <p id="gif-note"></p>
  </div>
</div>

<div id="stats-modal" class="modal" hidden>
  <div class="modal-body">
    <h2>Model leaderboard</h2>
    <button id="stats-close">Close</button>
    <div id="stats-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
